<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MicroTool Labs - Quick Quote</title>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Quick Quote</h1>
    <p id="message"></p>

    <p>Create a professional quote step by step.</p>

    <h2>Basic Information</h2>

    <form>

        <label for="customer">Customer</label>
        <input type="text" id="customer">

        <label for="project">Project / Job</label>
        <input type="text" id="project">

        <label for="date">Date</label>
        <input type="date" id="date">

        <label for="validUntil">Valid until</label>
        <input type="date" id="validUntil">

        <button type="submit">Next</button>

    </form>

    <section id="scopeSection">

    <h2>Scope of Work</h2>

    <h3>What's included?</h3>

    <textarea id="included" rows="4"></textarea>

    <h3>What's NOT included?</h3>

    <textarea id="excluded" rows="4"></textarea>

    <button type="button" id="backButton">Back</button>
    <button type="button" id="nextButton">Next</button>

    </section>

    <script src="script.js"></script>

</body>

</html>
<p id="resultado"></p>

    <script>
        function calcularArea() {
            const largura = document.getElementById("largura").value;
            const altura = document.getElementById("altura").value;
    
            const area = (largura * altura).toFixed(2);
    
            document.getElementById("resultado").textContent =
                "Área da parede: " + area + " m²";
        }
    </script>

</body>
</html>
