<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroTool Labs</title>
    <style>
    body {
        text-align: center;
    }
    </style>
</head>

<body>

    <h1>MicroTool Labs 🧪</h1>

    <p>Pequenas ferramentas para problemas reais.</p>

    <h2>Meu primeiro cálculo com JavaScript</h2>

    <input type="number" id="numero" placeholder="Digite um número">

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            const numero = document.getElementById("numero").value;
            const resultado = numero * 2;

            document.getElementById("resultado").textContent =
                "O dobro é: " + resultado;
        }
    </script>

</body>
</html>
