<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroTool Labs</title>
    <style>
    body {
        text-align: center;
    }
    </style>
</head>

<body>

   <h1>MicroTool Labs 🧪</h1>

<p>Pequenas ferramentas para problemas reais.</p>

<h2>Calculadora de área</h2>

<label for="largura">Largura da parede (m):</label>
<input type="number" id="largura" step="0.01">

<br><br>

<label for="altura">Altura da parede (m):</label>
<input type="number" id="altura" step="0.01">

<br><br>

<button onclick="calcularArea()">Calcular área</button>

<p id="resultado"></p>

<script>
    function calcularArea() {
        const largura = document.getElementById("largura").value;
        const altura = document.getElementById("altura").value;

        const area = largura * altura;

        document.getElementById("resultado").textContent =
            "Área da parede: " + area + " m²";
    }
</script>

</body>
</html>
